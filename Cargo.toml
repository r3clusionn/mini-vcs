[package]
name = "minivcs"
version = "0.1.0"
edition = "2021"
description = "A git-compatible version control system: loose objects, index, commits, branches, checkout, diff and merge, readable by real git."
license = "MIT"

[lib]
name = "minivcs"

[[bin]]
name = "mg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
debug = false
